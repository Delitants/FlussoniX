name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsrtp2-1 tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu fonts-dejavu-core postgresql-16
      - name: Verify vendor components are absent
        run: test ! -e /opt/flussonic
      - name: Preview package, service and credential regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*preview.py' -v
          python3 -m unittest discover -s tests -p 'test_generate_notices.py' -v
          python3 -m unittest discover -s tests -p 'test_inspect_demo.py' -v
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Patched QUIC regressions
        run: |
          cargo clippy --locked -p quinn-proto --no-default-features --features rustls-ring --all-targets -- -D warnings
          cargo test --locked -p quinn-proto --no-default-features --features rustls-ring --lib -- --test-threads=1
      - name: Streaming boundary regressions
        run: |
          cargo test --locked --test subtitle_preservation raw_hls_window_is_bounded_and_replacement_does_not_reuse_sequences_or_files -- --exact --test-threads=1
          cargo test --locked --lib rtsp_push -- --test-threads=1
          cargo test --locked --test rtsp_push independent_basic_and_digest_receivers_authenticate_and_decode_both_tracks -- --exact --test-threads=1
          cargo test --locked --test rtsp_push independent_receiver_decodes_native_rtsp_push -- --exact --test-threads=1
          cargo test --locked --test rtsp_push native_text_preserve_rejects_rtsp_before_connect_and_drop_delivers_audio -- --exact --test-threads=1
      - name: Owned cluster daemon environment isolation
        run: FLUSSONIX_SRT_PLAY_PASSPHRASE=owned-unused-SRT-setting cargo test --locked --test cluster_native_recovery daemon_recovers_equivalent_native_tls_origin_without_viewer_requests -- --exact --test-threads=1
      - name: Rust qualification and owned browser caption fixture
        id: rust_qualification
        env:
          FLUSSONIX_ELEMENTARY_ARTIFACT_DIR: ${{ runner.temp }}/flussonix-elementary-evidence
        run: |
          mkdir -p .runtime
          FLUSSONIX_NATIVE_AUDIO_FIXTURE_FILE="$PWD/.runtime/owned-native-audio.m4s" FLUSSONIX_NATIVE_FIXTURE_FILE="$PWD/.runtime/owned-native.m4s" FLUSSONIX_DVB_FIXTURE_FILE="$PWD/.runtime/owned-dvb.ts" FLUSSONIX_TELETEXT_FIXTURE_FILE="$PWD/.runtime/owned-teletext.ts" FLUSSONIX_708_FIXTURE_FILE="$PWD/.runtime/owned-708.ts" FLUSSONIX_CAPTION_FIXTURE_FILE="$PWD/.runtime/owned-captions.ts" cargo test --locked -- --test-threads=1
      - name: IPTV HA two-authority load smoke gate
        run: FLUSSONIX_IPTV_HA_LOAD_SECONDS=5 cargo test --locked --test iptv_ha_load -- --ignored --exact two_authorities_sustain_competing_channels_without_extra_grants --nocapture
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web && npm run build --prefix web
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify admin against live daemon
        run: |
          export FLUSSONIX_NATIVE_AUDIO_FIXTURE_FILE="$PWD/.runtime/owned-native-audio.m4s"
          export FLUSSONIX_NATIVE_FIXTURE_FILE="$PWD/.runtime/owned-native.m4s"
          export FLUSSONIX_DVB_FIXTURE_FILE="$PWD/.runtime/owned-dvb.ts"
          export FLUSSONIX_TELETEXT_FIXTURE_FILE="$PWD/.runtime/owned-teletext.ts"
          export FLUSSONIX_708_FIXTURE_FILE="$PWD/.runtime/owned-708.ts"
          export FLUSSONIX_CAPTION_FIXTURE_FILE="$PWD/.runtime/owned-captions.ts"
          export FLUSSONIX_ADMIN_USER=admin
          export FLUSSONIX_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export FLUSSONIX_VIEW_USER=viewer
          export FLUSSONIX_VIEW_PASSWORD="$(openssl rand -hex 24)"
          export FLUSSONIX_PEER_KEY="$(openssl rand -hex 32)"
          export FLUSSONIX_SRT_PLAY_PASSPHRASE="$(openssl rand -hex 24)"
          export FLUSSONIX_IPTV_PUBLIC_ORIGIN=http://127.0.0.1:18210
          mkdir -p .runtime
          export FLUSSONIX_TEST_CA_FILE="$PWD/.runtime/ui-test-ca.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .runtime/ui-test-ca.key -out "$FLUSSONIX_TEST_CA_FILE" -days 2 -subj '/CN=FlussoniX CI test CA' -addext 'basicConstraints=critical,CA:TRUE' > .runtime/ui-test-ca.log 2>&1
          chmod 600 .runtime/ui-test-ca.key
          ./target/debug/flussonix --config .runtime/config.json --media-dir .runtime/media --srt-play-listen 127.0.0.1:0 > .runtime/server.log 2>&1 &
          flussonix_ci_pid=$!
          trap 'kill "$flussonix_ci_pid"; wait "$flussonix_ci_pid" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18210/health > /dev/null; then break; fi
            sleep 0.25
          done
          npm test --prefix web
      - name: Verify IPTV HA admin against owned PostgreSQL authority
        env:
          FLUSSONIX_HA_UI_READY_FILE: ${{ runner.temp }}/flussonix-ha-ui-ready
          FLUSSONIX_HA_UI_STOP_FILE: ${{ runner.temp }}/flussonix-ha-ui-stop
        run: |
          export FLUSSONIX_ADMIN_USER=admin
          export FLUSSONIX_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export FLUSSONIX_VIEW_USER=viewer
          export FLUSSONIX_VIEW_PASSWORD="$(openssl rand -hex 24)"
          rm -f "$FLUSSONIX_HA_UI_READY_FILE" "$FLUSSONIX_HA_UI_STOP_FILE"
          cargo test --locked --test iptv_ha_browser_fixture launch_owned_ha_ui_server -- --ignored --exact --nocapture > .runtime/ha-ui.log 2>&1 &
          flussonix_ha_ui_pid=$!
          cleanup_ha_ui() {
            touch "$FLUSSONIX_HA_UI_STOP_FILE"
            if ! wait "$flussonix_ha_ui_pid"; then tail -n 40 .runtime/ha-ui.log; exit 1; fi
            rm -f "$FLUSSONIX_HA_UI_READY_FILE" "$FLUSSONIX_HA_UI_STOP_FILE"
          }
          trap cleanup_ha_ui EXIT
          for attempt in $(seq 1 120); do
            if test -s "$FLUSSONIX_HA_UI_READY_FILE"; then break; fi
            if ! kill -0 "$flussonix_ha_ui_pid" 2>/dev/null; then tail -n 40 .runtime/ha-ui.log; exit 1; fi
            sleep 0.25
          done
          test -s "$FLUSSONIX_HA_UI_READY_FILE"
          export FLUSSONIX_TEST_URL="$(cat "$FLUSSONIX_HA_UI_READY_FILE")"
          npm test --prefix web -- --grep 'IPTV HA live'
